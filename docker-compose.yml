# Local development: Vite dev server on http://localhost:5173 with hot reload.
# Start the Django API first (docker compose up in render-slow-pitch-django).
services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      DOCKER: "1"
      # The browser calls the API directly, so this is the address as seen from your Mac.
      # Set VITE_API_URL in .env to use another API (e.g. the Render one).
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep Linux node_modules inside Docker instead of in your project folder.
      - node_modules:/app/node_modules

volumes:
  node_modules:
